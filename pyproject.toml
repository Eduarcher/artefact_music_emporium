[project]
name = "music-emporium"
version = "0.1.0"
description = "Customer-service agent prototype for Empório da Música Instrumentos Musicais Ltda."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg",
    "chainlit",
    "fastapi",
    "httpx",
    "langchain",
    "langchain-core",
    "langchain-litellm>=0.11.0",
    "langchain-mcp-adapters",
    "langchain-ollama",
    "langgraph",
    "litellm",
    "mcp",
    "pgvector",
    "pydantic",
    "pydantic-settings",
    "pymupdf>=1.28.2",
    "sqlalchemy[asyncio]",
    "sse-starlette",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emporium"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]

[tool.uv]
package = true
