name: music-emporium

x-common-env: &common-env
  DATABASE_URL: postgresql+asyncpg://emporium:emporium@db:5432/emporium
  OLLAMA_BASE_URL: http://ollama:11434
  EMBEDDING_MODEL: bge-m3
  OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-4096}
  OLLAMA_REASONING: ${OLLAMA_REASONING:-false}
  OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-512}
  MCP_SHARED_SECRET: ${MCP_SHARED_SECRET:-change-me-in-production}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: emporium
      POSTGRES_PASSWORD: emporium
      POSTGRES_DB: emporium
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emporium -d emporium"]
      interval: 3s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_KEEP_ALIVE: 24h
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for model in bge-m3 qwen3.5:4b; do
          echo "Pulling $$model"
          ollama pull $$model || { echo "retrying $$model"; sleep 5; ollama pull $$model; }
        done

  ollama-warmup:
    build: .
    environment:
      <<: *common-env
      DEFAULT_MODEL: ${DEFAULT_MODEL:-ollama/qwen3.5:4b}
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    command: ["python", "-m", "emporium.warmup"]

  ingest:
    build: .
    environment:
      <<: *common-env
    depends_on:
      db:
        condition: service_healthy
      ollama-warmup:
        condition: service_completed_successfully
    command: ["python", "-m", "emporium.ingest"]

  mcp:
    build: .
    environment:
      <<: *common-env
      MCP_DATABASE_URL: postgresql+asyncpg://readonly:readonly@db:5432/emporium
    depends_on:
      ingest:
        condition: service_completed_successfully
    command: ["python", "-m", "emporium.tools.mcp_server"]

  backend:
    build: .
    environment:
      <<: *common-env
      MCP_URL: http://mcp:8000/mcp
      DEFAULT_MODEL: ${DEFAULT_MODEL:-ollama/qwen3.5:4b}
      MODEL_ALLOWLIST: ${MODEL_ALLOWLIST:-ollama/qwen3.5:4b}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODELS: ${ANTHROPIC_MODELS:-anthropic/claude-haiku-4-5,anthropic/claude-sonnet-5-5}
    ports:
      - "8000:8000"
    depends_on:
      mcp:
        condition: service_started
      ingest:
        condition: service_completed_successfully
    command: ["uvicorn", "emporium.api.app:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build: .
    environment:
      BACKEND_URL: http://backend:8000
      SHOW_AGENT_STEPS: ${SHOW_AGENT_STEPS:-false}
      CHAINLIT_DB_URL: postgresql+asyncpg://emporium:emporium@db:5432/emporium
      CHAINLIT_AUTH_SECRET: ${CHAINLIT_AUTH_SECRET:-change-me-in-production}
    ports:
      - "8001:8001"
    depends_on:
      backend:
        condition: service_started
    command: ["chainlit", "run", "services/frontend/app.py", "--host", "0.0.0.0", "--port", "8001"]

  test:
    build: .
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://emporium:emporium@db:5432/emporium_test
      OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDING_MODEL: bge-m3
    depends_on:
      mcp:
        condition: service_started
      ingest:
        condition: service_completed_successfully
    profiles: ["test"]
    command: ["pytest", "-q"]

volumes:
  db_data:
  ollama_data:
